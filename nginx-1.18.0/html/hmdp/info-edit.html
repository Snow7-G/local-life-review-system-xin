<!DOCTYPE html>
<html lang="en">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>黑马点评</title>
  <!-- 引入样式 -->
  <link rel="stylesheet" href="./css/element.css">
  <link href="./css/main.css" rel="stylesheet">
  <link href="./css/info.css" rel="stylesheet">

  <style type="text/css">

  </style>
</head>
<body>
<div id="app">
  <div class="header">
    <div class="header-back-btn" @click="goBack" ><i class="el-icon-arrow-left"></i></div>
    <div class="header-title">资料编辑&nbsp;&nbsp;&nbsp;</div>
  </div>
  <div class="edit-container">
    <div class="info-box">
      <div class="info-item">
        <div class="info-label">头像</div>
        <div class="info-btn" @click="$refs.avatar.click()">
          <img width="35" :src="user.icon || '/imgs/icons/default-icon.png'" alt="">
          <div><i class="el-icon-arrow-right"></i></div>
        </div>
        <input ref="avatar" type="file" accept="image/jpeg,image/png,image/gif" hidden @change="uploadAvatar">
      </div>
      <div class="divider"></div>
      <div class="info-item">
        <div class="info-label">昵称</div>
        <el-input v-model="user.nickName" maxlength="32" style="width: 65%"></el-input>
      </div>
      <div class="divider"></div>
      <div class="info-item">
        <div class="info-label">个人介绍</div>
        <el-input v-model="info.introduce" maxlength="128" placeholder="介绍一下自己" style="width: 65%"></el-input>
      </div>
    </div>
    <el-button type="primary" :loading="saving" @click="saveProfile" style="margin: 20px; width: calc(100% - 40px)">保存资料</el-button>
  </div>
  <foot-bar :active-btn="4"></foot-bar>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<!-- 引入组件库 -->
<script src="./js/element.js"></script>
<script src="./js/common.js"></script>
<script src="./js/footer.js"></script>
<script>

  const app = new Vue({
    el: "#app",
    data: {
      user: {},
      info: {},
      saving: false,
    },
    created() {
      this.checkLogin();
    },
    methods: {
      checkLogin() {
        // 查询用户信息
        axios.get("/user/me")
        .then(({data}) => {
          this.user = data;
          return axios.get("/user/info/" + data.id)
        })
        .then(({data}) => {
          this.info = data || {}
        })
        .catch(err => {
          this.$message.error(err);
          setTimeout(() => location.href = "login.html", 1000)
        })
      },
      uploadAvatar(event) {
        const file = event.target.files[0]
        if (!file) return
        const form = new FormData()
        form.append("file", file)
        axios.post("/upload/blog", form)
          .then(({data}) => this.user.icon = "/imgs" + data)
          .catch(err => this.$message.error(err))
      },
      saveProfile() {
        this.saving = true
        axios.put("/user/me", {
          nickName: this.user.nickName,
          icon: this.user.icon || "",
          introduce: this.info.introduce || ""
        }).then(() => {
          sessionStorage.removeItem("userInfo")
          this.$message.success("资料已保存")
          setTimeout(() => location.href = "info.html", 500)
        }).catch(err => this.$message.error(err))
          .finally(() => this.saving = false)
      },
      goBack(){
        history.back();
      }
    },

  })
</script>
</body>
</html>
