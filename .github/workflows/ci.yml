name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server nginx
      - name: Check frontend request handling
        run: node tests/common.test.cjs
      - name: Check Nginx configuration
        run: |
          mkdir -p nginx-1.18.0/logs
          sudo nginx -t -p "$GITHUB_WORKSPACE/nginx-1.18.0/" -c conf/nginx.conf
      - name: Build and run tests
        run: mvn -B -ntp verify
      # agent-core 是独立模块（不并入根 reactor：Maven 要求聚合项目 packaging=pom，
      # 而根打包为 Boot fat jar，改布局代价大）。用 -f 直接构建，同样在 CI 中覆盖它。
      - name: Build and run agent-core tests
        run: mvn -f agent-core/pom.xml -B -ntp verify
